plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}



dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // 26.2-Port: falls jemals architectury API gebraucht wird, hier "implementation"
    // statt "modImplementation" verwenden (kein Remapping unter loom-no-remap).
    //implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // 26.2-Port: siehe fabric/build.gradle - "namedElements" gibt es unter
    // dev.architectury.loom-no-remap nicht mehr als eigene Konfiguration von :common,
    // deshalb normaler Projekt-Dependency ohne 'configuration:'-Parameter.
    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // 26.2-Port: shadowJar ist jetzt selbst das finale Artefakt (siehe unten).
    archiveClassifier = ''
}

// 26.2-Port: loom.convertAw2At(...) existiert unter dev.architectury.loom-no-remap 1.17
// NICHT (siehe Build-Fehler "Could not find method convertAw2At()" - die Extension ist
// laut Fehlermeldung tatsächlich net.fabricmc.loom.extension.LoomGradleExtensionImpl,
// d.h. loom-no-remap reicht hier direkt an fabric-loom durch, ohne Architecturys eigene
// AW->AT-Konvertierungslogik). Laut docs.architectury.dev/loom/access_transformer wird
// für NeoForge stattdessen von Hand eine META-INF/accesstransformer.cfg in Mojang-
// Mappings erwartet ("Basically keep your ATs from Forge/NeoForge, don't remap them").
// Diese Datei liegt jetzt unter neoforge/src/main/resources/META-INF/accesstransformer.cfg
// und wird von NeoForge automatisch per Konvention erkannt - keine weitere Gradle-
// Konfiguration nötig.

jar {
    archiveClassifier = 'slim'
}

tasks.named('assemble') {
    dependsOn(shadowJar)
}
