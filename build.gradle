plugins {
    // 26.2-Port: Minecraft ist seit 26.1 nicht mehr obfuskiert (Mojang-Namen sind bereits
    // die "echten" Klassennamen), daher "loom-no-remap" statt "loom". Version laut
    // docs.architectury.dev (Requirements für Minecraft 26.2): Architectury Loom 1.17+.
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    // Architectury Plugin 3.5+ für Minecraft 26.2 laut docs.architectury.dev.
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.2.2' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name-26.2"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url "https://maven.parchmentmc.org" }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"

        // 26.2-Port: KEINE mappings-Zeile mehr. Unter "loom-no-remap" gibt es nichts zu
        // remappen - Minecraft liefert ab 26.1 direkt Mojangs offizielle (Named-)Namen
        // aus, es existiert kein separater obfuskierter Namensraum mehr, den man auf
        // Mojang-Mappings abbilden müsste. Die vorherige Zeile
        //   mappings loom.officialMojangMappings()
        // entfiel deshalb ersatzlos (analog zur offiziellen Architectury-Doku für 26.2,
        // die im "Adding the API to an existing project"-Abschnitt ebenfalls keine
        // mappings-Deklaration mehr zeigt).
        //
        // Uncomment to add Parchment (readable parameter names) once you've set
        // parchment_version in gradle.properties to a version that actually exists
        // for 26.2 (see https://parchmentmc.org/docs/getting-started):
        //
        // mappings loom.layered() {
        //     parchment("org.parchmentmc.data:parchment-${rootProject.parchment_version}@zip")
        // }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        // 26.2-Port: Mojang liefert Minecraft 26.1+ mit Java 25 aus (siehe
        // docs.architectury.dev Requirements-Tabelle), daher Java 21 -> 25.
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
