# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Mod properties
mod_version=1.1
maven_group=traben
archives_name=entity_pin_cushions
enabled_platforms=fabric,neoforge
# Minecraft properties
minecraft_version=26.2
# Dependencies
fabric_loader_version=0.19.3
neoforge_version=26.2.0.15-beta

# NOTE (26.2 port): the classic "forge" platform has been dropped, see settings.gradle
# for why. If it ever gains real Architectury support again, re-enable it there and
# add a forge_version=26.2-... line back here.

# Parchment (readable parameter names) is intentionally NOT enabled by default here.
# At the time of this port the exact release-export version for 26.2 could not be
# verified reliably. If you want it, check https://parchmentmc.org/docs/getting-started
# for the current "parchment-26.2" export version, set it below, and uncomment the
# parchment(...) line in the root build.gradle.
#parchment_version=26.2:YYYY.MM.DD
